<index.html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BAJA PRO SERVICES - Licensed & Insured Contractors. Air Conditioning, Electrical, Plumbing, Solar & More.">
    <title>BAJA PRO SERVICES | Licensed & Insured Contractors</title>
    <style>
        :root {
            --primary-blue: #1e40af;
            --dark-blue: #0f172a;
            --accent-green: #16a34a;
            --bg-light: #f8fafc;
            --border-color: #cbd5e1;
            --focus-color: #3b82f6;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-light);
            color: #1e293b;
            line-height: 1.6;
        }

        /* --- HERO --- */
        .hero {
            width: 100%;
            height: 300px;
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('hero.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .hero h1 { font-size: 2rem; letter-spacing: 2px; margin-bottom: 10px; }

        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
        }

        .lang-switch button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        .lang-switch button.active {
            background: white;
            color: var(--dark-blue);
        }

        /* --- FORM CONTAINER --- */
        .container {
            width: 92%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            margin: -80px auto 60px;
            position: relative;
        }

        .section-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary-blue);
            margin: 30px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after { content: ""; height: 1px; background: #e2e8f0; flex: 1; }

        .form-group { margin-bottom: 18px; }

        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #334155; }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: var(--transition);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--focus-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* SERVICES GRID */
        .services-grid {
            max-height: 250px;
            overflow-y: auto;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            background: #fcfdfe;
        }

        .service-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .service-item:hover { background: #f1f5f9; }
        .service-item input { width: 20px; height: 20px; margin-right: 12px; accent-color: var(--primary-blue); }

        /* BUTTONS */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: var(--transition);
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-service { background: var(--dark-blue); }
        .btn-estimate { background: var(--accent-green); }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

        /* --- FLOATING CALL BUTTON --- */
        .call-fab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 65px;
            height: 65px;
            background-color: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
            z-index: 100;
            text-decoration: none;
            transition: var(--transition);
        }

        .call-fab:hover { transform: scale(1.1); }
        .call-fab svg { width: 30px; height: 30px; fill: currentColor; }

        .footer { text-align: center; padding: 20px; color: #94a3b8; font-size: 13px; }

        @media (max-width: 600px) {
            .container { padding: 25px; margin-top: -60px; }
            .btn-group { grid-template-columns: 1fr; }
            .hero h1 { font-size: 1.5rem; }
            .call-fab { bottom: 20px; left: 20px; width: 55px; height: 55px; }
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="lang-switch">
        <button id="lang-en" onclick="setLang('en')" class="active">EN</button>
        <button id="lang-es" onclick="setLang('es')">ES</button>
    </div>
    <h1>BAJA PRO SERVICES</h1>
    <p>Licensed & Insured Professional Solutions</p>
</div>

<a href="tel:6122198325" class="call-fab" title="Call Us Now">
    <svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>
</a>

<div class="container">
    <form id="serviceForm">
        <span class="section-title" id="t1"></span>
        <div class="form-group">
            <label for="name" id="nameLabel"></label>
            <input id="name" type="text" required>
        </div>

        <div class="form-group">
            <label for="phone" id="phoneLabel"></label>
            <input id="phone" type="tel" required>
        </div>

        <div class="form-group">
            <label for="segment" id="segmentLabel"></label>
            <select id="segment" required></select>
        </div>

        <div class="form-group">
            <label for="address" id="addressLabel"></label>
            <input id="address" type="text">
        </div>

        <span class="section-title" id="t2"></span>
        <div class="services-grid" id="services"></div>

        <span class="section-title" id="t3"></span>
        <div class="form-group">
            <label for="notes" id="notesLabel"></label>
            <textarea id="notes" rows="3"></textarea>
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-service" id="b1" onclick="sendWhatsApp('service')"></button>
            <button type="button" class="btn btn-estimate" id="b2" onclick="sendWhatsApp('estimate')"></button>
        </div>
    </form>
</div>

<div class="footer" id="footText"></div>

<script>
    const CONFIG = {
        whatsappNumbers: { service: '526121673200', estimate: '526122311422' }
    };

    let currentLang = 'en';

    const ui = {
        en: {
            t1: 'Client Info', t2: 'Services', t3: 'Project Details',
            pName: 'Full Name', pPhone: 'Phone Number', pAddr: 'Address', pNotes: 'Specific requests...',
            segs: ['Residential', 'Commercial', 'Industrial'],
            b1: 'REQUEST SERVICE', b2: 'GET ESTIMATE',
            foot: '© 2026 BAJA PRO SERVICES • Licensed & Insured',
            services: ['AC Maintenance', 'AC Installation', 'Painting', 'Waterproofing', 'Flooring', 'Electrical Repairs', 'Plumbing', 'CCTV Systems', 'Solar Panels', 'Cleaning', 'Security Film']
        },
        es: {
            t1: 'Datos del Cliente', t2: 'Servicios', t3: 'Detalles del Proyecto',
            pName: 'Nombre Completo', pPhone: 'Teléfono', pAddr: 'Dirección', pNotes: 'Notas adicionales...',
            segs: ['Residencial', 'Comercial', 'Industrial'],
            b1: 'SOLICITAR SERVICIO', b2: 'PEDIR COTIZACIÓN',
            foot: '© 2026 BAJA PRO SERVICES • Licenciados y Asegurados',
            services: ['Mant. Aire Acondicionado', 'Inst. Aire Acondicionado', 'Pintura', 'Impermeabilización', 'Pisos', 'Reparaciones Eléctricas', 'Plomería', 'Cámaras CCTV', 'Paneles Solares', 'Limpieza', 'Película de Seguridad']
        }
    };

    function setLang(lang) {
        currentLang = lang;
        const d = ui[lang];
        
        document.getElementById('lang-en').classList.toggle('active', lang === 'en');
        document.getElementById('lang-es').classList.toggle('active', lang === 'es');

        document.getElementById('t1').textContent = d.t1;
        document.getElementById('t2').textContent = d.t2;
        document.getElementById('t3').textContent = d.t3;
        document.getElementById('nameLabel').textContent = d.pName;
        document.getElementById('phoneLabel').textContent = d.pPhone;
        document.getElementById('addressLabel').textContent = d.pAddr;
        document.getElementById('notesLabel').textContent = d.pNotes;
        document.getElementById('b1').textContent = d.b1;
        document.getElementById('b2').textContent = d.b2;
        document.getElementById('footText').textContent = d.foot;

        const seg = document.getElementById('segment');
        seg.innerHTML = d.segs.map(s => `<option value="${s}">${s}</option>`).join('');

        const grid = document.getElementById('services');
        grid.innerHTML = d.services.map(s => `
            <label class="service-item">
                <input type="checkbox" value="${s}">
                <span>${s}</span>
            </label>
        `).join('');
    }

    function sendWhatsApp(type) {
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        if(!name || !phone) return alert(currentLang === 'en' ? 'Please fill Name and Phone' : 'Por favor llena Nombre y Teléfono');

        const selected = [...document.querySelectorAll('#services input:checked')].map(i => i.value);
        const notes = document.getElementById('notes').value;
        
        let msg = `*BAJA PRO SERVICES*\n*Cliente:* ${name}\n*Tel:* ${phone}\n*Tipo:* ${document.getElementById('segment').value}\n*Servicios:* ${selected.join(', ')}\n*Notas:* ${notes}`;
        
        window.open(`https://wa.me/${CONFIG.whatsappNumbers[type]}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    setLang('en');
</script>
</body>
</html>
