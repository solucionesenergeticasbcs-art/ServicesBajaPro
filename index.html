<index.html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAJA PRO SERVICES | Home Solutions</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #16a34a;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- HERO SECTION --- */
        .hero {
            width: 100%;
            height: 300px;
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.8)), 
                        url('hero.png') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            position: relative;
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .lang-switch button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        .lang-switch button:hover { background: white; color: var(--primary); }

        .hero h1 { 
            margin: 0; 
            font-size: 32px; 
            letter-spacing: 2px; 
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .hero .subtitle { 
            margin-top: 10px; 
            font-size: 16px; 
            opacity: 0.9;
            font-weight: 400;
        }

        /* --- FORM CONTAINER --- */
        .container {
            width: 90%;
            max-width: 500px;
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin: -50px auto 40px; /* Eleva el contenedor sobre el Hero */
            box-sizing: border-box;
            position: relative;
            z-index: 10;
        }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin: 20px 0 10px;
            display: block;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            outline-color: var(--accent);
        }

        .services-grid {
            display: grid;
            grid-template-columns: 1fr;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            background: #fafafa;
        }

        .service-item {
            display: flex;
            align-items: center;
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            border-bottom: 1px solid #f1f5f9;
        }

        .service-item:hover { background: #f1f5f9; }
        .service-item input { width: auto; margin-right: 12px; margin-bottom: 0; }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            color: white;
        }

        .btn-primary { background: var(--primary); }
        .btn-accent { background: var(--accent); }
        .btn:active { transform: scale(0.98); }

        .footer { font-size: 12px; color: var(--muted); padding: 20px 0 40px; text-align: center; }

        @media (max-width: 480px) {
            .hero h1 { font-size: 26px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="lang-switch">
        <button onclick="setLang('en')">EN</button>
        <button onclick="setLang('es')">ES</button>
    </div>
    <h1>BAJA PRO SERVICES</h1>
    <p id="heroSub" class="subtitle"></p>
</div>

<div class="container">
    <span class="section-title" id="t1"></span>
    <input id="name" type="text">
    <input id="phone" type="tel">
    <select id="segment"></select>
    <input id="address" type="text">

    <span class="section-title" id="t2"></span>
    <div class="services-grid" id="services"></div>

    <span class="section-title" id="t3"></span>
    <textarea id="notes" rows="3"></textarea>

    <button class="btn btn-primary" id="b1" onclick="send('526121673200')"></button>
    <button class="btn btn-accent" id="b2" onclick="send('526122311422')"></button>
</div>

<div class="footer" id="foot"></div>

<script>
    let cur = "en";
    const data = {
        en: {
            sub: "Licensed • Insured • Fast Response",
            t1: "Client Information",
            t2: "Services Requested",
            t3: "Project Details / Notes",
            pName: "Full Name",
            pPhone: "Phone Number",
            pAddr: "Project Address",
            pNotes: "How can we help you?",
            segs: ["Residential", "Commercial", "Industrial"],
            b1: "REQUEST SERVICE",
            b2: "REQUEST ESTIMATE",
            err: "Name and Phone are required",
            foot: "© 2026 BAJA PRO SERVICES • All Rights Reserved",
            servs: ["AC Maintenance", "AC Installation", "Painting", "Waterproofing", "Flooring", "Electrical", "Plumbing", "CCTV Systems", "Metal Fab", "Drywall", "Solar Panels", "Cleaning", "Security Film"]
        },
        es: {
            sub: "Licenciados • Asegurados • Respuesta Rápida",
            t1: "Información del Cliente",
            t2: "Servicios Requeridos",
            t3: "Detalles / Notas",
            pName: "Nombre Completo",
            pPhone: "Número de Teléfono",
            pAddr: "Dirección del Proyecto",
            pNotes: "¿En qué podemos ayudarte?",
            segs: ["Residencial", "Comercial", "Industrial"],
            b1: "SOLICITAR SERVICIO",
            b2: "SOLICITAR PRESUPUESTO",
            err: "Nombre y Teléfono son requeridos",
            foot: "© 2026 BAJA PRO SERVICES • Todos los derechos reservados",
            servs: ["Mantenimiento AC", "Instalación AC", "Pintura", "Impermeabilización", "Pisos", "Electricidad", "Plomería", "Cámaras CCTV", "Herrería", "Tablaroca", "Paneles Solares", "Limpieza", "Película de Seguridad"]
        }
    };

    function setLang(l) {
        cur = l;
        const d = data[l];
        document.getElementById("heroSub").innerText = d.sub;
        document.getElementById("t1").innerText = d.t1;
        document.getElementById("t2").innerText = d.t2;
        document.getElementById("t3").innerText = d.t3;
        document.getElementById("name").placeholder = d.pName;
        document.getElementById("phone").placeholder = d.pPhone;
        document.getElementById("address").placeholder = d.pAddr;
        document.getElementById("notes").placeholder = d.pNotes;
        document.getElementById("b1").innerText = d.b1;
        document.getElementById("b2").innerText = d.b2;
        document.getElementById("foot").innerText = d.foot;

        const seg = document.getElementById("segment");
        seg.innerHTML = d.segs.map(s => `<option value="${s}">${s}</option>`).join('');

        const grid = document.getElementById("services");
        grid.innerHTML = d.servs.map(s => `
            <label class="service-item">
                <input type="checkbox" value="${s}"> ${s}
            </label>
        `).join('');
    }

    function send(num) {
        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const selected = [...document.querySelectorAll("#services input:checked")].map(i => i.value);

        if (!name || !phone) { alert(data[cur].err); return; }

        let msg = `*BAJA PRO SERVICES*\n\n`;
        msg += `*Name:* ${name}\n*Phone:* ${phone}\n`;
        msg += `*Type:* ${document.getElementById("segment").value}\n`;
        msg += `*Address:* ${document.getElementById("address").value || 'N/A'}\n`;
        if(selected.length > 0) msg += `\n*Services:* ${selected.join(", ")}\n`;
        if(document.getElementById("notes").value) msg += `\n*Notes:* ${document.getElementById("notes").value}`;

        window.open(`https://wa.me{num}?text=${encodeURIComponent(msg)}`, "_blank");
    }

    setLang("en");
</script>

</body>
</html>
