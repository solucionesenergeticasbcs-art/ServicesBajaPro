<index.html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAJA PRO SERVICES | Licensed & Insured Contractors</title>
    <style>
        :root {
            --primary-blue: #1e40af;
            --dark-blue: #0f172a;
            --accent-green: #16a34a;
            --bg-light: #f1f5f9;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: #1e293b;
        }

        /* --- HERO SECTION --- */
        .hero {
            width: 100%;
            aspect-ratio: 16/7;
            min-height: 250px;
            background: url('hero.png') center/cover no-repeat;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            position: relative;
        }

        .lang-switch {
            margin: 15px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        .lang-switch button {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: 0.3s;
        }

        .lang-switch button:hover { background: var(--primary-blue); color: white; }

        /* --- FORM CONTAINER --- */
        .container {
            width: 92%;
            max-width: 550px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            margin: -60px auto 40px;
            position: relative;
            z-index: 10;
        }

        .section-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-blue);
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after { content: ""; height: 1px; background: #e2e8f0; flex: 1; }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus { outline: 2px solid var(--primary-blue); border-color: transparent; }

        /* LISTA DE SERVICIOS (21 SERVICIOS) */
        .services-grid {
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px;
            background: #f8fafc;
        }

        .service-item {
            display: flex;
            align-items: center;
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 1px solid #edf2f7;
        }

        .service-item:hover { background: #f1f5f9; }
        .service-item input { width: auto; margin-right: 12px; margin-bottom: 0; }

        /* BOTONES */
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            color: white;
            transition: 0.2s;
        }

        .btn-service { background: var(--dark-blue); }
        .btn-estimate { background: var(--accent-green); }
        .btn:active { transform: scale(0.98); }

        .footer { text-align: center; font-size: 12px; color: #94a3b8; padding-bottom: 40px; }

        @media (max-width: 480px) {
            .container { padding: 20px; margin-top: -40px; }
            .hero { aspect-ratio: 16/9; }
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="lang-switch">
        <button onclick="setLang('en')">EN</button>
        <button onclick="setLang('es')">ES</button>
    </div>
</div>

<div class="container">
    <span class="section-title" id="t1">CLIENT INFORMATION</span>
    <input id="name" type="text">
    <input id="phone" type="tel">
    <select id="segment"></select>
    <input id="address" type="text">

    <span class="section-title" id="t2">SERVICES</span>
    <div class="services-grid" id="services"></div>

    <span class="section-title" id="t3">PROJECT DETAILS</span>
    <textarea id="notes" rows="3"></textarea>

    <button class="btn btn-service" id="b1" onclick="sendWhatsApp('526121673200')"></button>
    <button class="btn btn-estimate" id="b2" onclick="sendWhatsApp('526122311422')"></button>
</div>

<div class="footer" id="footText">© 2026 BAJA PRO SERVICES</div>

<script>
    let currentLang = "en";

    const servicesList = {
        en: [
            "01. Air Conditioning Maintenance", "02. Air Conditioning Installation", "03. Interior & Exterior Painting",
            "04. Waterproofing Services", "05. Flooring Installation", "06. Electrical Repairs",
            "07. New Electrical Installations", "08. Plumbing Services", "09. CCTV Security Systems",
            "10. Electric Fence Installation", "11. Aluminum Works", "12. Metal Fabrication",
            "13. Drywall Installation", "14. Custom Carpentry", "15. Blinds & Shades",
            "16. Leak Detection & Repair", "17. Water Heater Installation", "18. General Maintenance",
            "19. Solar Panel Installation", "20. Professional Cleaning", "21. Anti-Vandal Security Window Film"
        ],
        es: [
            "01. Mantenimiento de Aire Acondicionado", "02. Instalación de Aire Acondicionado", "03. Pintura Interior y Exterior",
            "04. Impermeabilización", "05. Instalación de Pisos", "06. Reparaciones Eléctricas",
            "07. Instalaciones Eléctricas Nuevas", "08. Servicios de Plomería", "09. Sistemas de Cámaras CCTV",
            "10. Instalación de Cerco Eléctrico", "11. Trabajos en Aluminio", "12. Herrería y Fabricación Metálica",
            "13. Instalación de Drywall / Tablaroca", "14. Carpintería Residencial y Comercial", "15. Persianas y Cortinas",
            "16. Detección y Reparación de Fugas", "17. Instalación de Boilers / Calentadores", "18. Mantenimiento General",
            "19. Instalación de Paneles Solares", "20. Limpieza Profesional", "21. Venta e Instalación de Película de Seguridad"
        ]
    };

    const ui = {
        en: {
            t1: "CLIENT INFORMATION", t2: "SERVICES", t3: "PROJECT DETAILS",
            pName: "Full Name", pPhone: "Phone Number", pAddr: "Job Site Address", pNotes: "Describe your project...",
            segs: ["Residential", "Commercial", "Industrial"],
            b1: "REQUEST SERVICE", b2: "REQUEST ESTIMATE",
            alert: "Name and Phone are required", foot: "© 2026 BAJA PRO SERVICES • Licensed & Insured"
        },
        es: {
            t1: "DATOS DEL CLIENTE", t2: "SERVICIOS", t3: "DETALLES DEL PROYECTO",
            pName: "Nombre Completo", pPhone: "Teléfono", pAddr: "Dirección del Proyecto", pNotes: "Describe tu proyecto...",
            segs: ["Residencial", "Comercial", "Industrial"],
            b1: "SOLICITAR SERVICIO", b2: "SOLICITAR PRESUPUESTO",
            alert: "Nombre y Teléfono son obligatorios", foot: "© 2026 BAJA PRO SERVICES • Licenciados y Asegurados"
        }
    };

    function setLang(l) {
        currentLang = l;
        const d = ui[l];
        document.getElementById("t1").innerText = d.t1;
        document.getElementById("t2").innerText = d.t2;
        document.getElementById("t3").innerText = d.t3;
        document.getElementById("name").placeholder = d.pName;
        document.getElementById("phone").placeholder = d.pPhone;
        document.getElementById("address").placeholder = d.pAddr;
        document.getElementById("notes").placeholder = d.pNotes;
        document.getElementById("b1").innerText = d.b1;
        document.getElementById("b2").innerText = d.b2;
        document.getElementById("footText").innerText = d.foot;

        const seg = document.getElementById("segment");
        seg.innerHTML = d.segs.map(s => `<option value="${s}">${s}</option>`).join('');

        const grid = document.getElementById("services");
        grid.innerHTML = servicesList[l].map(s => `
            <label class="service-item"><input type="checkbox" value="${s}"> ${s}</label>
        `).join('');
    }

    function sendWhatsApp(num) {
        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const selected = [...document.querySelectorAll("#services input:checked")].map(i => i.value);

        if (!name || !phone) { alert(ui[currentLang].alert); return; }

        let msg = `*BAJA PRO SERVICES*\n\n`;
        msg += `*Name:* ${name}\n*Phone:* ${phone}\n`;
        msg += `*Type:* ${document.getElementById("segment").value}\n`;
        msg += `*Address:* ${document.getElementById("address").value || 'N/A'}\n`;
        if(selected.length > 0) msg += `\n*Services:* ${selected.join(", ")}\n`;
        if(document.getElementById("notes").value) msg += `\n*Notes:* ${document.getElementById("notes").value}`;

        window.open(`https://wa.me{num}?text=${encodeURIComponent(msg)}`, "_blank");
    }

    setLang("en");
</script>
</body>
</html>
