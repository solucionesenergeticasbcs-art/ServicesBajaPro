<index.html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAJA PRO SERVICES | Licensed & Insured Contractors</title>
<meta name="description" content="Professional Residential & Commercial Services in Baja. Licensed • Insured • Fast Response. Electrical, Plumbing, AC, Solar, Security Film & More.">

<link rel="icon" href="favicon.png">

<style>
:root {
  --primary:#0f172a;
  --accent:#16a34a;
  --light:#f8fafc;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--light);
  color:#111827;
}

.hero{
  background:url('hero.png') center/cover no-repeat;
  aspect-ratio:16/6;
  min-height:260px;
}

.hero-title{
  text-align:center;
  padding:40px 20px;
  background:white;
  border-bottom:1px solid #e5e7eb;
}

.hero-title h1{
  margin:0;
  font-size:36px;
  font-weight:900;
  letter-spacing:3px;
}

.hero-title p{
  margin-top:8px;
  font-size:14px;
  color:#475569;
}

.lang-switch{
  position:absolute;
  top:20px;
  right:20px;
}

.lang-switch button{
  border:none;
  padding:6px 14px;
  margin-left:5px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:650px;
  margin:30px auto;
  background:white;
  border-radius:16px;
  box-shadow:0 20px 50px rgba(0,0,0,.08);
  padding:30px;
}

.section-title{
  font-size:13px;
  font-weight:bold;
  margin:25px 0 10px;
  color:#0f172a;
  letter-spacing:1px;
}

input, select, textarea{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:14px;
}

.services-list{
  max-height:260px;
  overflow-y:auto;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:10px;
}

.service-item{
  display:flex;
  align-items:center;
  padding:6px 0;
  font-size:14px;
}

.service-item input{
  margin-right:10px;
}

.service-item:last-child{
  font-weight:600;
  color:#dc2626;
}

.btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  margin-top:10px;
  letter-spacing:1px;
}

.btn-tech{
  background:#0f172a;
  color:white;
}

.btn-sales{
  background:var(--accent);
  color:white;
}

.footer{
  text-align:center;
  font-size:12px;
  padding:25px;
  color:#64748b;
}
</style>
</head>

<body>

<div class="lang-switch">
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
</div>

<div class="hero"></div>

<div class="hero-title">
<h1>BAJA PRO SERVICES</h1>
<p id="heroSub">Licensed • Insured • Fast Response</p>
</div>

<div class="container">

<div class="section-title" id="titleClient">CLIENT INFORMATION</div>
<input id="name">
<input id="phone">
<input id="email">
<input id="address">
<select id="segment"></select>

<div class="section-title" id="titleServices">SERVICES</div>
<div class="services-list" id="services"></div>

<div class="section-title" id="titleNotes">PROJECT DETAILS</div>
<textarea id="notes" rows="4"></textarea>

<button class="btn btn-tech" onclick="sendWhatsApp('526121673200')">
REQUEST SERVICE
</button>

<button class="btn btn-sales" onclick="sendWhatsApp('526122311422')">
REQUEST ESTIMATE
</button>

</div>

<div class="footer">
© 2026 BAJA PRO SERVICES • All Rights Reserved
</div>

<script>
let currentLang="en";

const services={
en:[
"01. Air Conditioning Maintenance",
"02. Air Conditioning Installation",
"03. Interior & Exterior Painting",
"04. Waterproofing Services",
"05. Flooring Installation",
"06. Electrical Repairs",
"07. New Electrical Installations",
"08. Plumbing Services",
"09. CCTV Security Systems",
"10. Electric Fence Installation",
"11. Aluminum Works",
"12. Metal Fabrication",
"13. Drywall Installation",
"14. Custom Carpentry",
"15. Blinds & Shades",
"16. Leak Detection & Repair",
"17. Water Heater Installation",
"18. General Maintenance",
"19. Solar Panel Installation",
"20. Professional Cleaning",
"21. Sales & Installation of Anti-Vandal Security Window Film"
],
es:[
"01. Mantenimiento de Aire Acondicionado",
"02. Instalación de Aire Acondicionado",
"03. Pintura Interior y Exterior",
"04. Impermeabilización",
"05. Instalación de Pisos",
"06. Reparaciones Eléctricas",
"07. Instalaciones Eléctricas Nuevas",
"08. Servicios de Plomería",
"09. Sistemas de Cámaras CCTV",
"10. Instalación de Cerco Eléctrico",
"11. Trabajos en Aluminio",
"12. Herrería y Fabricación Metálica",
"13. Instalación de Drywall / Tablaroca",
"14. Carpintería Residencial y Comercial",
"15. Persianas y Cortinas",
"16. Detección y Reparación de Fugas",
"17. Instalación de Boilers / Calentadores",
"18. Mantenimiento General",
"19. Instalación de Paneles Solares",
"20. Limpieza Profesional",
"21. Venta e Instalación de Película de Seguridad Antivandálica"
]
};

function setLang(lang){
currentLang=lang;
document.documentElement.lang=lang;

document.getElementById("titleClient").innerText=lang==="en"?"CLIENT INFORMATION":"DATOS DEL CLIENTE";
document.getElementById("titleServices").innerText=lang==="en"?"SERVICES":"SERVICIOS";
document.getElementById("titleNotes").innerText=lang==="en"?"PROJECT DETAILS":"DETALLES DEL PROYECTO";
document.getElementById("heroSub").innerText=lang==="en"?"Licensed • Insured • Fast Response":"Licenciados • Asegurados • Respuesta Rápida";

document.getElementById("name").placeholder=lang==="en"?"Full Name":"Nombre Completo";
document.getElementById("phone").placeholder=lang==="en"?"Phone Number":"Teléfono";
document.getElementById("email").placeholder=lang==="en"?"Email Address":"Correo Electrónico";
document.getElementById("address").placeholder=lang==="en"?"Project Address":"Dirección del Proyecto";
document.getElementById("notes").placeholder=lang==="en"?"Describe your project...":"Describe tu proyecto...";

const segment=document.getElementById("segment");
segment.innerHTML="";
["Residential","Commercial","Industrial"].forEach((s,i)=>{
let opt=document.createElement("option");
opt.textContent=lang==="en"?["Residential","Commercial","Industrial"][i]:["Residencial","Comercial","Industrial"][i];
segment.appendChild(opt);
});

const list=document.getElementById("services");
list.innerHTML="";
services[lang].forEach(serv=>{
let label=document.createElement("label");
label.className="service-item";
label.innerHTML=`<input type="checkbox" value="${serv}">${serv}`;
list.appendChild(label);
});
}

function sendWhatsApp(number){
const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;
if(!name||!phone){alert("Name and phone required");return;}

const selected=[...document.querySelectorAll("#services input:checked")].map(i=>i.value).join(", ");

let message=`BAJA PRO SERVICES\n\nName: ${name}\nPhone: ${phone}\nServices: ${selected}`;
window.open(`https://wa.me/${number}?text=${encodeURIComponent(message)}`,"_blank");
}

setLang("en");
</script>

</body>
</html>
